<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>

    <!-- Color Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DE9B6"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E6ED"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="32" fill="url(#bg)"/>

  <!-- Isometric Cube Framework -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <polygon points="400,100 650,250 650,550 400,700 150,550 150,250"/>
    <line x1="400" y1="100" x2="400" y2="700"/>
    <line x1="150" y1="250" x2="650" y2="550"/>
    <line x1="650" y1="250" x2="150" y2="550"/>
  </g>

  <!-- Orbital Rings -->
  <circle cx="400" cy="330" r="210" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="400" cy="330" r="230" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.15"/>

  <!-- Satellite Nodes -->
  <!-- Top: Play/Lectures -->
  <g transform="translate(400, 120)">
    <circle cx="0" cy="0" r="22" fill="#0B132B" stroke="url(#gold)" stroke-width="2.5" filter="url(#glow)"/>
    <polygon points="-4,-7 8,0 -4,7" fill="#FFD700"/>
  </g>

  <!-- Right: Digital Library -->
  <g transform="translate(600, 330)">
    <circle cx="0" cy="0" r="22" fill="#0B132B" stroke="url(#cyan)" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M -8,-5 C -4,-8 0,-5 0,-5 C 0,-5 4,-8 8,-5 L 8,6 C 4,3 0,6 0,6 C 0,6 -4,3 -8,6 Z" fill="none" stroke="#00F2FE" stroke-width="1.8"/>
  </g>

  <!-- Bottom: Research Labs -->
  <g transform="translate(400, 540)">
    <circle cx="0" cy="0" r="22" fill="#0B132B" stroke="url(#emerald)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="3" fill="#00E676"/>
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#00E676" stroke-width="1.2" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#00E676" stroke-width="1.2" transform="rotate(-30)"/>
  </g>

  <!-- Left: Repository Sharing -->
  <g transform="translate(200, 330)">
    <circle cx="0" cy="0" r="22" fill="#0B132B" stroke="url(#cyan)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="-4" cy="-3" r="2.5" fill="#00F2FE"/>
    <circle cx="5" cy="-5" r="2.5" fill="#00F2FE"/>
    <circle cx="2" cy="4" r="2.5" fill="#00F2FE"/>
    <line x1="-4" y1="-3" x2="5" y2="-5" stroke="#00F2FE" stroke-width="1.2"/>
    <line x1="-4" y1="-3" x2="2" y2="4" stroke="#00F2FE" stroke-width="1.2"/>
  </g>

  <!-- Central Hexagon Hub -->
  <g transform="translate(400, 330)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#101935" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Open Book -->
    <path d="M -65,20 C -35,5 0,20 0,20 C 0,20 35,5 65,20 L 65,-25 C 35,-40 0,-25 0,-25 C 0,-25 -35,-40 -65,-25 Z" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0,-25 L 0,20" stroke="url(#cyan)" stroke-width="3"/>
    <!-- Graduation Cap -->
    <path d="M 0,-65 L 55,-40 L 0,-15 L -55,-40 Z" fill="url(#gold)" filter="url(#glow)"/>
    <path d="M 30,-27 L 30,-5 C 30,12 -30,12 -30,-5 L -30,-27" fill="none" stroke="#FFD700" stroke-width="2.5"/>
    <path d="M 45,-35 L 52,-15 L 48,-15" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <circle cx="50" cy="-12" r="3" fill="#FFFFFF"/>
    <!-- Atom Core -->
    <circle cx="0" cy="-2" r="6" fill="#00F2FE" filter="url(#glow)"/>
    <ellipse cx="0" cy="-2" rx="18" ry="6" fill="none" stroke="#00E676" stroke-width="1.5" transform="rotate(20)"/>
    <ellipse cx="0" cy="-2" rx="18" ry="6" fill="none" stroke="#00F2FE" stroke-width="1.5" transform="rotate(-20)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="14" fill="url(#text)" text-anchor="middle">OSE</text>
  <text x="400" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#FFD700" text-anchor="middle" opacity="0.95">OMNI RESEARCH EDUCATION</text>
  <text x="400" y="715" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#8D99AE" text-anchor="middle">RESEARCH LABS • ACADEMIC HUB • DIGITAL LIBRARY • PROJECT REPOS</text>
</svg>
